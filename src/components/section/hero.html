<section class="hero">
    <div class="hero__overlay">
        <img class="hero__overlay--image" src="@/images/hero-bg.png" alt="">
        <!-- <video class="hero__overlay--video" src="@/images/hero-video.mp4" muted autoplay playinline loop> -->
    </div>
    <div class="container">
        <div class="placeholder"></div>
        <div class="hero__content">
            <div class="hero__content--inner">
                <div class="hero__content-title">
                    <p class="body6">HUQUQIY YORDAM — BIR JOYDA</p>
                </div>
                <div class="h1-wrapper">
                    <h1 class="headline1">Kerakli huquqiy yordamni oson toping</h1>
                    <p class="body2">ADVO orqali mos advokat yoki yuridik tashkilotni toping, xizmatlarni solishtiring va <br>
                        konsultatsiyani bir necha qadamda boshlang.</p>
                </div>
                <div class="hero__content-app">
                    <div class="hero__content-app-store">
                        <img src="@/images/phone.svg" alt="">
                        <div class="hero__content-app-store-text">
                            <p class="body12">Download on the</p>
                            <h5 class="body5">App store</h5>
                        </div>
                    </div>
                    <div class="hero__content-app-store">
                        <img src="@/images/play-store.svg" alt="">
                        <div class="hero__content-app-store-text">
                            <p class="body12">Get is on </p>
                            <h5 class="body5">Google Paly</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="hero-image">
            <div class="hero-image__item hero-image__item--side">
                <img src="@/images/hero-img-1.png" alt="App Preview 1">
            </div>
            <div class="hero-image__item hero-image__item--main">
                <img src="@/images/hero-img-2.png" alt="App Preview 2">
            </div>
            <div class="hero-image__item hero-image__item--side">
                <img src="@/images/hero-img-3.png" alt="App Preview 3">
            </div>
        </div>
        <div class="placeholder"></div>
    </div>

    <div class="hero-carousel owl-carousel owl-theme">
        <div class="hero-carousel__item">
            <img src="@/images/hero-carusel-1.svg" alt="Business Insider">
        </div>
        <div class="hero-carousel__item">
            <img src="@/images/hero-carusel-2.svg" alt="Wired">
        </div>
        <div class="hero-carousel__item">
            <img src="@/images/hero-carusel-3.svg" alt="TechCrunch">
        </div>
        <div class="hero-carousel__item">
            <img src="@/images/hero-carusel-4.svg" alt="Bloomberg">
        </div>
        <div class="hero-carousel__item">
            <img src="@/images/hero-carusel-5.svg" alt="The Guardian">
        </div>
        <div class="hero-carousel__item">
            <img src="@/images/hero-carusel-6.svg" alt="Gizmodo">
        </div>
        <div class="hero-carousel__item">
            <img src="@/images/hero-carusel-7.svg" alt="Engadget">
        </div>
        <div class="hero-carousel__item">
            <img src="@/images/hero-carusel-8.svg" alt="Fast Company">
        </div>
    </div>
